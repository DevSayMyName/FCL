<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="jueves.css">
    <title>JORNADA JUEVES | FN LEAGUE</title>
    <link rel="icon" type="image/png" href="../../img/icono.PNG">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Capa oscura para legibilidad sobre el fondo -->
  <div class="bg-overlay-dark"></div>

  <!-- Menú FLC -->
  <header class="menuFLC-header">
    <nav class="menuFLC">
      <!-- Logo -->
      <div class="menuFLC-logo">
        <a href="../../index.html">
          <img src="../../img/icono.PNG" alt="Logo FN League" class="menuFLC-logo-img">  
        </a>
        
        <!-- Botón de cambio de tema al lado del logo -->
        <button id="theme-toggle" class="btn-theme-toggle" aria-label="Cambiar modo">
          <span id="theme-icon">🌙</span>
        </button>
      </div>

      <button class="menuFLC-hamburger" aria-label="Abrir menú">
        <span class="linea"></span>
        <span class="linea"></span>
        <span class="linea"></span>
      </button>

      <!-- Enlaces -->
      <ul class="menuFLC-links">
        <li><a href="jueves.html">Inicio</a></li>
        <li><a href="../../index.html">Regresar</a></li>
      </ul>
    </nav>
  </header>

  <!-- Librería para leer Google Sheets -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <section class="visor-capturas-section">
    <div class="visor-capturas-container">
      
      <!-- Encabezado -->
      <div class="visor-header">
        <span class="visor-tag">Comprobantes Oficiales</span>
        <h2 class="visor-titulo">RESULTADOS DEL <span class="text-dorado">JUEVES</span></h2>
        <div class="visor-divider"></div>
      </div>

      <!-- 1. Selector de Semanas -->
      <div class="selector-semanas" id="contenedor-semanas"></div>

      <!-- 2. Selector de Salas (Sala 1, Sala 2, Sala 3, Sala 4) -->
      <div class="botones-salas" id="contenedor-salas">
        <button class="btn-sala loading">Cargando salas...</button>
      </div>

      <!-- 3. Visor de Imágenes Separado por Grupos (Arriba A x B / Abajo C x D) -->
      <div id="contenedor-fotos-grid" class="grupos-sala-wrapper"></div>
      <p id="mensaje-estado" class="mensaje-estado" style="display: none;"></p>

    </div>
  </section>

  <script src="../../script.js"></script>
  <script src="jueves.js"></script>
</body>
</html>
